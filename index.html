<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="yandex" content="noindex, nofollow">
<title>Bogdan Griviuk Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Herr+Von+Muellerhoff&display=swap" rel="stylesheet">
<style>
/* VOICE occasion: an architect's portfolio in the manner of a high-end design studio site, cinematic and quiet
   IDEA a studio showreel: black screen, one full-bleed render, big lowercase words, projects as large frames, drawings shown on paper
   PICTURE the courthouse render full screen; every project opens into its own sheet-by-sheet gallery
   COLOUR black ground in both themes, white ink, grey meta, electric blue for contact, paper white behind drawings
   TYPE Montserrat 300-700 + Herr Von Muellerhoff for the Mountainight signature
   LAYOUT thin fixed bar; full-screen hero; filter row; two-column project frames; light stats band; about; contact; footer */
:root{color-scheme:dark;--bg:#000;--ink:#f4f4f2;--mute:#8d8d8a;--line:#262626;--blue:#0a6cff;--paper:#f3f3f1}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Montserrat,"Century Gothic",system-ui,sans-serif;overflow-x:clip}
body.lock{overflow:hidden}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.05;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
p{margin:0}
.sig{font-family:"Herr Von Muellerhoff",cursive;font-weight:400;letter-spacing:0;line-height:1}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:999px;border:0;font:500 14px/1 Montserrat,system-ui,sans-serif;text-decoration:none;cursor:pointer;color:#fff;background:#000;transition:background .2s}
.pill.blue{background:var(--blue)}
.pill.blue:hover{background:#2a80ff}
.pill.glass{background:rgba(30,30,30,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pill:focus-visible,.chip:focus-visible,.frame:focus-visible,.langs button:focus-visible{outline:2px solid #fff;outline-offset:3px}
.bar{position:fixed;inset:0 0 auto 0;z-index:20;height:52px;background:rgba(0,0,0,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:0 max(2vw,14px)}
.bar nav{display:flex;gap:4px 22px;flex-wrap:wrap}
.bar nav a{font-size:13px;text-decoration:none;color:#d8d8d6;padding:6px 0}
.bar nav a:hover{color:#fff}
.bar .sig{font-size:34px;color:#fff;text-decoration:none;padding-top:8px}
.bar .r{display:flex;justify-content:flex-end;align-items:center;gap:12px}
.bar .r .pill{min-height:34px;font-size:13px;padding:0 16px}
.langs{display:flex;gap:2px}
.langs button{background:none;border:0;color:#8d8d8a;font:500 13px/1 Montserrat,system-ui,sans-serif;padding:10px 6px;min-height:34px;cursor:pointer}
.langs button[aria-pressed=true]{color:#fff;text-decoration:underline;text-underline-offset:5px}
.hero{position:relative;height:clamp(300px,44vh,440px);overflow:hidden;background:#0b0b0b}
.hero img,.hero video.bg{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(28px) brightness(.45);transform:scale(1.05)}
.hero video.fg{position:absolute;top:52px;bottom:0;left:50%;transform:translateX(-50%);height:calc(100% - 52px);width:auto;max-width:100%;aspect-ratio:16/9;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 40%,rgba(0,0,0,.15) 70%,rgba(0,0,0,.7))}
.hero h1{position:absolute;left:16px;right:16px;top:24%;text-align:center;font-size:clamp(42px,7.6vw,112px);color:rgba(255,255,255,.92);letter-spacing:-.03em;text-shadow:0 2px 30px rgba(0,0,0,.35)}
.hero .ask{position:absolute;left:50%;bottom:clamp(20px,5vh,48px);transform:translateX(-50%);width:min(620px,calc(100% - 32px));display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 8px 8px 22px;border-radius:999px;background:rgba(30,30,30,.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:13px;line-height:1.35}
.hero .ask .pill{flex:none}
.hero .ask a.me{color:#fff;font-weight:700;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}.hero .ask a.me:hover{text-decoration-color:#fff}
.hero .cap{position:absolute;right:max(2vw,14px);bottom:clamp(86px,13vh,120px);font-size:12px;color:rgba(255,255,255,.7)}
.work{padding-top:clamp(26px,3.2vw,44px)}
.work h2{text-align:center;font-size:clamp(34px,5vw,62px)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:18px 16px clamp(20px,2.6vw,32px)}
.chip{min-height:40px;padding:0 18px;border-radius:999px;border:1px solid #333;background:none;color:#cfcfcc;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip span{color:#6d6d6a;font-size:12px}
.chip[aria-pressed=true]{background:#f4f4f2;color:#000;border-color:#f4f4f2}
.chip[aria-pressed=true] span{color:#555}
.frames{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.frame{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-decoration:none;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit;width:100%}
.frame .art{flex:none;width:100%;position:relative;aspect-ratio:16/10;overflow:hidden;background:#111}
.frame .art.paper{background:var(--paper)}
.frame .art img,.frame .art video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
.frame .art.paper img{object-fit:contain;padding:4%}
.frame:hover .art img{transform:scale(1.03)}
.frame .n{position:absolute;right:14px;bottom:14px;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff}
.frame .cap{padding:24px clamp(16px,3vw,36px) clamp(40px,5vw,64px)}
.frame h3{text-transform:uppercase;font-weight:600;font-size:clamp(17px,1.8vw,24px);letter-spacing:0}
@media(min-width:641px){.frame h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame .meta{min-height:3.2em}}
@media(min-width:641px) and (max-width:820px){.frame h3{font-size:15px}}
.frame .meta{color:#a3a39f;font-weight:400;font-size:clamp(14px,1.3vw,16px);margin-top:10px}
.frame .tag+.tag{margin-left:6px}
.frame .tag.doc{color:#8fb6ff;border-color:#23395f}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 clamp(20px,3vw,32px)}
.tab{min-height:42px;padding:0 18px;border-radius:999px;border:1px solid #333;background:none;color:#cfcfcc;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.tab span{color:#6d6d6a;font-size:12px}
.tab[aria-selected=true]{background:#f4f4f2;color:#000;border-color:#f4f4f2}
.tab[aria-selected=true] span{color:#555}
.frame .tag{display:inline-block;margin-top:12px;font-size:12px;color:#bdbdba;border:1px solid #333;border-radius:999px;padding:4px 12px}
.stats{margin:clamp(40px,5vw,72px) max(1vw,10px) 0;background:#e9e9e7;color:#111;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:clamp(28px,4vw,48px) clamp(18px,3vw,40px)}
.stats b{display:block;font-size:clamp(26px,3vw,40px);font-weight:600;letter-spacing:-.02em}
.stats span{font-size:14px;line-height:1.4;display:block;margin-top:8px;max-width:18em;color:#333}
.about{max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,128px) max(4vw,16px) 0}
.about .top{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:end;margin-bottom:clamp(40px,5vw,64px)}
.about .top img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.about h2{font-size:clamp(34px,5vw,62px);margin-bottom:20px}
.about .lead{color:#c9c9c6;font-size:clamp(16px,1.5vw,19px);max-width:60ch}
.job{display:grid;grid-template-columns:10em minmax(0,1fr) minmax(0,1.2fr);gap:8px 32px;padding:24px 0;border-top:1px solid var(--line)}
.job:last-child{border-bottom:1px solid var(--line)}
.job .y{color:var(--mute);white-space:nowrap}
.job h3{text-transform:uppercase;font-size:18px;letter-spacing:0}
.job small{display:block;color:var(--mute);font-size:14px;margin-top:6px}
.job p{color:#b4b4b1;font-size:15px}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin-top:48px}
.tools h3{font-size:15px;text-transform:uppercase;letter-spacing:.02em;margin-bottom:10px}
.tools p{color:#a2a29f;font-size:14px}
.services{max-width:1240px;margin:0 auto;padding:clamp(72px,9vw,128px) max(4vw,16px) 0}
.services h2{font-size:clamp(34px,5vw,62px)}
.sv-lead{color:#c9c9c6;font-size:clamp(16px,1.5vw,19px);max-width:60ch;margin-top:18px}
.sv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:clamp(32px,4vw,52px)}
.sv{background:#000;padding:clamp(20px,2.2vw,30px);display:flex;flex-direction:column;gap:12px;min-height:260px}
.sv h3{font-size:17px;text-transform:uppercase;letter-spacing:0;line-height:1.25}
.sv p{color:#a2a29f;font-size:14px;flex:1}
.sv .price{font-size:clamp(22px,2vw,28px);font-weight:600;letter-spacing:-.02em;color:#fff}
.sv .price small{display:block;font-size:12px;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:2px}
.sv:last-child:nth-child(odd){grid-column:span 2}
.sv.ask .price{color:var(--blue);font-size:clamp(17px,1.5vw,20px);line-height:1.25}
.sv-note{color:var(--mute);font-size:14px;margin-top:20px;max-width:70ch}
.back{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid #333;text-decoration:none;font-size:14px;margin-bottom:clamp(28px,4vw,48px)}
.back:hover{background:#151515}
.back.more{margin:28px 0 0}
body.pg-about .hero,body.pg-about .work,body.pg-about .stats,body.pg-about .services{display:none}
body.pg-services .hero,body.pg-services .work,body.pg-services .stats,body.pg-services .about{display:none}
body:not(.pg-services) .services{display:none}
body.pg-services .services{padding-top:clamp(88px,10vw,130px)}
body:not(.pg-about) .about{display:none}
body.pg-about .about{padding-top:clamp(88px,10vw,130px)}
.job h3 a{text-decoration:none;border-bottom:1px solid #444}
.job h3 a:hover{border-color:#fff}
.cvbox{position:fixed;inset:0;z-index:70;background:rgba(8,8,8,.96);display:none;flex-direction:column}.cvbox.on{display:flex}
.cvbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px max(3vw,14px);border-bottom:1px solid #222}.cvbar h3{font-size:15px;font-weight:500}.cvbar>div{display:flex;gap:8px}
.cvpg{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:clamp(12px,3vw,32px)}.cvpg img{width:min(900px,100%);height:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.call{width:calc(100% - 2*max(4vw,16px));max-width:calc(1240px - 2*max(4vw,16px));margin:clamp(80px,10vw,140px) auto 0;position:relative;overflow:hidden;min-height:380px}
.call img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.call::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.3))}
.call .in{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr);align-content:space-between;gap:40px;padding:clamp(22px,4vw,34px);min-height:380px}
.call h2{font-size:clamp(22px,2.8vw,34px);font-weight:500;max-width:22em;line-height:1.25}
@media(min-width:900px){.call .in{grid-template-columns:minmax(0,1fr) auto;align-content:end;align-items:end}.call .in>div{justify-self:end}}
.mailrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:6px 6px 6px 20px;border-radius:999px;background:rgba(30,30,30,.6);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);width:fit-content;max-width:100%}
.mailrow a{font-size:15px;text-decoration:none;overflow-wrap:anywhere}
.note{font-size:13px;color:#cfcfcc;min-height:18px;margin-top:8px}
.cvrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
footer{max-width:1240px;margin:clamp(80px,10vw,140px) auto 0;padding:0 max(4vw,16px) 40px}
footer .sig{font-size:clamp(54px,12vw,128px);text-align:center;display:block;color:#fff;margin-bottom:28px;overflow:visible;line-height:1.25;padding:0 .35em}
footer .cols{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;border-top:1px solid var(--line);padding-top:28px;font-size:14px}
footer .cols span{display:block;color:var(--mute);margin-bottom:6px}
footer .cols a{text-decoration:none;overflow-wrap:anywhere}
@media(max-width:640px){footer .cols>div:first-child{grid-column:1/-1}footer .cols a{overflow-wrap:normal}.stats b{font-size:24px;line-height:1.15}}
footer small{display:block;color:#5d5d5b;margin-top:32px;font-size:13px}
.viewer{position:fixed;inset:0;z-index:50;background:#0b0b0b;display:none;overflow-y:auto;overscroll-behavior:contain}
.viewer.on{display:block}
.vhead{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px max(3vw,14px);background:rgba(11,11,11,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #1f1f1f}
.vhead h3{font-size:clamp(16px,2vw,20px);text-transform:uppercase;letter-spacing:0}
.vhead .meta{color:var(--mute);font-size:13px;margin-top:4px}
.vhead .ctrl{display:flex;gap:8px}
.vbtn{min-width:44px;min-height:44px;border-radius:999px;border:1px solid #333;background:#151515;cursor:pointer;font-size:18px;padding:0 14px}
.vbtn:hover{background:#222}
.vbody{max-width:1500px;margin:0 auto;padding:clamp(20px,3vw,40px) max(3vw,14px) 80px}
.vbody .desc{color:#c9c9c6;max-width:70ch;font-size:clamp(15px,1.4vw,17px);margin-bottom:clamp(24px,3vw,40px)}
.vbody figure{margin:0 0 clamp(14px,2vw,24px)}
.vbody .grp{font-size:clamp(13px,1.2vw,15px);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#9a9a96;margin:clamp(28px,4vw,52px) auto 14px;max-width:1400px}.vbody .grp:first-of-type{margin-top:8px}
.vbody .mrow{display:flex;gap:10px;margin:0 auto 10px}.vbody .mrow figure{margin:0}.vbody .mrow+.vnext,.vbody .mrow:last-of-type{margin-bottom:clamp(14px,2vw,24px)}
.vbody .mrow figure.zoom{position:fixed;inset:0;z-index:60;background:#0b0b0b;overflow:auto;display:flex;align-items:flex-start;justify-content:center}.vbody .mrow figure.zoom img{max-width:100%;width:auto;height:auto}
.vbody .mrow figure.ph .wm{font-size:clamp(20px,1.8vw,32px)}
@media(max-width:640px){.vbody .mrow{flex-direction:column;max-width:none!important}.vbody .mrow>div{flex:none!important}}
.vbody figure.ph{position:relative}
.vbody figure.ph .wm{position:absolute;right:clamp(10px,1.6vw,22px);bottom:clamp(4px,1vw,12px);font-family:"Herr Von Muellerhoff",cursive;font-size:clamp(26px,2.6vw,42px);line-height:1.3;color:rgba(255,255,255,.78);text-shadow:0 1px 8px rgba(0,0,0,.45);pointer-events:none;user-select:none;padding:0 .2em}
.vbody .solo-v figure.ph{width:fit-content;margin-left:auto;margin-right:auto}
.vbody figure.zoom .wm{display:none}
img,video{-webkit-user-drag:none;user-select:none;-webkit-touch-callout:none}

.vbody .pair{display:flex;margin-left:auto!important;margin-right:auto!important;gap:clamp(14px,2vw,24px);margin:0 0 clamp(14px,2vw,24px)}.vbody .pair figure{margin:0}.vbody .pair figure.zoom{position:fixed;inset:0;z-index:60;background:#0b0b0b;overflow:auto;display:flex;align-items:flex-start;justify-content:center}.vbody .pair figure.zoom img{max-width:100%;width:auto;height:auto}.vbody .solo-v figure img{max-height:80vh;width:auto;max-width:100%;display:block;margin:0 auto}
@media(max-width:640px){.vbody .pair{flex-direction:column;max-width:none!important}.vbody .pair>div{flex:none!important}}

.vbody figure img{width:100%;height:auto;cursor:zoom-in}
.vbody figure.paper{background:var(--paper);padding:clamp(8px,1.5vw,20px)}
.vbody figure.zoom{overflow-x:auto}
.vbody figure.zoom img{width:auto;max-width:none;cursor:zoom-out}
.vbody .sp{position:relative;overflow:hidden;width:100%}
.vbody .sp img{position:absolute;max-width:none;height:auto}
.vbody figure.zoom .sp{width:220%}
.vbody figure.ph.zoom{justify-content:center;align-items:center}.vbody figure.ph.zoom .sp{width:min(100%,calc((100vh - 20px) * var(--ar,1.5)));margin:auto}
.vbody figure.zoom .sp img{cursor:zoom-out}
.sp .bg{position:absolute;inset:0;background-repeat:no-repeat;cursor:zoom-in;-webkit-touch-callout:none}.vbody figure.zoom .sp .bg{cursor:zoom-out}
.vbody .hint{color:#6d6d6a;font-size:13px;margin-bottom:16px}
.vnext{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;border-top:1px solid #222;padding-top:24px}
@media(max-width:1100px){.sv-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){.bar nav{display:none}.bar{grid-template-columns:auto minmax(0,1fr)}.stats,.tools,footer .cols{grid-template-columns:repeat(2,minmax(0,1fr))}.job{grid-template-columns:8em minmax(0,1fr)}.job p{grid-column:2}}
@media(max-width:640px){.hero{height:460px}.hero h1{top:76px;font-size:clamp(26px,8.4vw,40px)}}
@media(max-width:640px){.sv-grid{grid-template-columns:minmax(0,1fr)}.sv:last-child:nth-child(odd){grid-column:auto}.sv{min-height:0}.frames{grid-template-columns:minmax(0,1fr)}.job{grid-template-columns:minmax(0,1fr)}.job p{grid-column:auto}.hero .ask{border-radius:22px;padding:14px 14px 14px 18px;flex-wrap:wrap}.bar .r{gap:4px}.bar .r .pill{padding:0 12px}.bar .sig{font-size:28px}.about .top{grid-template-columns:minmax(0,1fr)}.about .top img{max-width:260px}.call{margin-inline:10px}.chips{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.frame .art img{transition:none}}
</style>
</head>
<body>
<header class="bar">
  <nav aria-label="Sections"><a href="#work" data-t="n_work"></a><a href="#services" data-t="n_srv"></a><a href="#about" data-t="n_about"></a><a href="#contact" data-t="n_contact"></a></nav>
  <a class="sig" href="#top" aria-label="Mountainight">Mountainight</a>
  <div class="r"><div class="langs" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div><a class="pill blue" href="#contact" data-t="contact"></a></div>
</header>

<section class="hero" id="top">
  <video class="bg" src="img/hero5.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video><video class="fg" src="img/hero5.mp4" poster="img/hero5.jpg" autoplay muted loop playsinline preload="auto"></video>
  <div class="shade"></div>
  <h1 data-t="h_title"></h1>
  <div class="ask"><span data-h="h_ask"></span><a class="pill" href="#work" data-t="see"></a></div>
</section>

<section class="work" id="work">
  <h2 data-t="w_title"></h2>
  <div class="chips" id="chips" role="group"></div>
  <div class="frames" id="grid"></div>
</section>

<section class="stats">
  <div><b data-t="s1b"></b><span data-t="s1"></span></div>
  <div><b data-t="s2b"></b><span data-t="s2"></span></div>
  <div><b data-t="s3b"></b><span data-t="s3"></span></div>
  <div><b data-t="s4b"></b><span data-t="s4"></span></div>
</section>

<section class="services" id="services">
  <a class="back" href="#top" data-t="back"></a>
  <h2 data-t="sv_title"></h2>

DATA.sort((a,b)=>(+b.y||0)-(+a.y||0));
const CATS=['arch','design'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lang='en',cat='all',cur=-1;
const $=id=>document.getElementById(id);
document.addEventListener('contextmenu',e=>{if(e.target.closest('img,video,.wm,.art,figure,.hero'))e.preventDefault()});document.addEventListener('dragstart',e=>{if(e.target.tagName==='IMG'||e.target.tagName==='VIDEO')e.preventDefault()});

const CV={EN:['cv/Bogdan_Griviuk_CV_EN.pdf','img/cvp-EN.jpg','CV · English'],ES:['cv/Bogdan_Griviuk_CV_ES.pdf','img/cvp-ES.jpg','CV · Español']};
const openCV=k=>{const c=CV[k];$('cvt').textContent=c[2];$('cvimg').src=c[1];$('cvimg').alt=c[2];$('cvdl').dataset.f=c[0];$('cvbox').classList.add('on');document.body.classList.add('lock');$('cvx').focus()};
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){}})();
document.addEventListener('click',async e=>{if(e.target.id!=='cvdl')return;const f=e.target.dataset.f;if(!f)return;
  if(!DL){window.open(f,'_blank','noopener');return}
  try{const b=await (await fetch(f)).blob();await DL.save({filename:f.split('/').pop(),data:b})}catch(err){if(err&&(err.code==='unavailable'||err.code==='host_unavailable'||err.code==='not_granted'))window.open(f,'_blank','noopener')}});
const closeCV=()=>{$('cvbox').classList.remove('on');if(!$('viewer').classList.contains('on'))document.body.classList.remove('lock')};
document.addEventListener('click',e=>{const b=e.target.closest('[data-cv]');if(b){e.preventDefault();openCV(b.dataset.cv)}else if(e.target.id==='cvx'||e.target.classList.contains('cvpg'))closeCV()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('cvbox').classList.contains('on'))closeCV()});

const isDoc=k=>k==='doc'||k.startsWith('apt');
const tabL=k=>k.startsWith('apt')?T[lang].tabs.apt+k.slice(3):T[lang].tabs[k];
const inCat=(p,c)=>c==='all'||p.cat===c;
const list=()=>DATA.filter(p=>inCat(p,cat));
const drawChips=()=>{
  const n=c=>DATA.filter(p=>inCat(p,c)).length;
  $('chips').innerHTML=['all',...CATS].map(c=>`<button class="chip" type="button" data-c="${c}" aria-pressed="${c===cat}">${esc(c==='all'?T[lang].all:T[lang].cats[c])}<span>${n(c)}</span></button>`).join('');
};
const drawGrid=()=>{
  $('grid').innerHTML=list().map(p=>{const t=p.t[lang];const tags=[...new Set(p.tabs.map(x=>isDoc(x.k)?'doc':x.k))];
    return `<button class="frame" type="button" data-id="${esc(p.id)}" aria-label="${esc(T[lang].open+': '+t[0])}"><div class="art${p.cover.d?' paper':''}">${p.cover.v?`<video src="img/${esc(p.cover.v)}" poster="img/${esc(p.cover.f)}_t.jpg" autoplay muted loop playsinline preload="metadata"></video>`:`<img src="img/${esc(p.cover.f)}_t.jpg" alt="" loading="lazy">`}<span class="n">${esc(T[lang].sheets(p.n))}</span></div><div class="cap"><h3>${esc(t[0])}</h3><div class="meta">${esc(t[1])}${p.y?' · '+esc(p.y):''}</div>${tags.map(k=>`<span class="tag${k==='doc'?' doc':''}">${esc(T[lang].tabs[k])}</span>`).join('')}</div></button>`}).join('');
};
const drawTl=()=>{$('tl').innerHTML=EXP[lang].map(([y,c,r,d,u])=>`<div class="job"><div class="y">${esc(y)}</div><div><h3>${u?`<a href="https://${esc(u)}" target="_blank" rel="noopener">${esc(c)} ↗</a>`:esc(c)}</h3><small>${esc(r)}${u?' · '+esc(u):''}</small></div><p>${esc(d)}</p></div>`).join('')};
const drawSv=()=>{$('svgrid').innerHTML=SV[lang].map(([h,p,pr,u])=>`<div class="sv${pr?'':' ask'}"><h3>${esc(h)}</h3><p>${esc(p)}</p><div class="price">${esc(pr||T[lang].sv_deal)}${u?`<small>${esc(u)}</small>`:''}</div></div>`).join('')};
let vtab=null;
const fig=(x,alt,j)=>x.p?`<figure class="ph"${x.m?` style="max-width:${x.m}px;margin-left:auto;margin-right:auto"`:''}><div class="sp" style="aspect-ratio:${x.w}/${x.h};--ar:${(x.w/x.h).toFixed(3)}"><img src="img/${esc(x.s)}.jpg" alt="${esc(alt)}" loading="${j<2?'eager':'lazy'}" draggable="false" style="width:${x.W/x.w*100}%;left:0;top:${-x.y/x.h*100}%"></div><span class="wm" aria-hidden="true">Mountainight</span></figure>`:x.s?`<figure class="paper"><div class="sp" style="aspect-ratio:${x.w}/${x.h}"><div class="bg" role="img" aria-label="${esc(alt)}" style="background-image:url('img/${esc(x.s)}.jpg');background-size:${(x.W/x.w*100).toFixed(4)}% auto;background-position:0 ${x.H>x.h?(x.y/(x.H-x.h)*100).toFixed(4):0}%"></div></div></figure>`:`<figure class="ph"${x.m?` style="max-width:${x.m}px;margin-left:auto;margin-right:auto"`:''}><img src="img/${esc(x.f)}.jpg" width="${x.w}" height="${x.h}" alt="${esc(alt)}" loading="${j<2?'eager':'lazy'}" draggable="false"><span class="wm" aria-hidden="true">Mountainight</span></figure>`;
const isV=x=>!x.s&&x.h>x.w*1.05;
const rows=(items,title)=>{const q=items.map((x,j)=>[x,j]);let out='';
  while(q.length){const [x,j]=q.shift();
    if(isV(x)){const k=q.findIndex(([y])=>isV(y));
      if(k>=0){const [y,i]=q.splice(k,1)[0];out+=`<div class="pair" style="max-width:calc(80vh * ${(x.w/x.h+y.w/y.h).toFixed(3)} + 24px)"><div style="flex:${x.w/x.h} 1 0">${fig(x,title+' '+(j+1),j)}</div><div style="flex:${y.w/y.h} 1 0">${fig(y,title+' '+(i+1),i)}</div></div>`;continue}
      out+=`<div class="solo-v">${fig(x,title+' '+(j+1),j)}</div>`;continue}
    out+=fig(x,title+' '+(j+1),j)}
  return out};
const mosaic=(items,title)=>{const q=items.map((x,j)=>[x,j]);const P=[1,2,3,2];let out='',k=0;
  while(q.length){if(q[0][0].g){out+=`<h3 class="grp">${esc(T[lang].tabs.type+q[0][0].g)}</h3>`;k=1}
    let n=P[k++%P.length];if(n===1&&q[0][0].h>q[0][0].w)n=2;
    let lim=q.findIndex(([x],i)=>i>0&&x.g);if(lim<0)lim=q.length;
    const row=q.splice(0,Math.min(n,lim));const A=row.reduce((s,[x])=>s+x.w/x.h,0);
    out+=`<div class="mrow" style="max-width:calc(84vh * ${A.toFixed(3)} + ${(row.length-1)*10}px)">`+row.map(([x,j])=>`<div style="flex:${(x.w/x.h).toFixed(4)} 1 0">${fig(x,title+' '+(j+1),j)}</div>`).join('')+`</div>`}
  return out};
const openP=(id,push=true,tab)=>{
  const i=DATA.findIndex(p=>p.id===id);if(i<0)return;const p=DATA[i];if(i!==cur)vtab=null;if(tab)vtab=tab;const TB=[...p.tabs].sort((a,b)=>(b.k==='doc')-(a.k==='doc'));if(!p.tabs.some(x=>x.k===vtab))vtab=TB[0].k;cur=i;const t=p.t[lang];
  $('vt').textContent=t[0];$('vm').textContent=t[1]+(p.y?' · '+p.y:'');
  const tb=p.tabs.find(x=>x.k===vtab);const nx=DATA[(i+1)%DATA.length];
  const tabs=p.tabs.length>1?`<div class="tabs" role="tablist">${TB.map(x=>`<button type="button" role="tab" class="tab" data-tab="${esc(x.k)}" aria-selected="${x.k===vtab}">${esc(tabL(x.k))} <span>${x.items.length}</span></button>`).join('')}</div>`:'';
  $('vbody').innerHTML=`<p class="desc">${esc(t[2])}</p>${tabs}${isDoc(vtab)?`<p class="hint">${esc(T[lang].hint)}</p>`:''}`+
    (!isDoc(vtab)?mosaic(tb.items,t[0]):rows(tb.items,t[0]))+
    `<div class="vnext"><button class="pill glass" type="button" id="vback">${esc(T[lang].prev)}</button><button class="pill blue" type="button" id="vfwd">${esc(T[lang].next)}: ${esc(nx.t[lang][0])}</button></div>`;
  $('viewer').classList.add('on');$('viewer').scrollTop=0;document.body.classList.add('lock');
  if(push&&location.hash!=='#'+id){try{history.pushState(null,'','#'+id)}catch(e){location.hash=id}}
  $('vclose').focus({preventScroll:true});
};
const closeV=(push=true)=>{
  if(!$('viewer').classList.contains('on'))return;
  $('viewer').classList.remove('on');document.body.classList.remove('lock');
  const id=cur>=0?DATA[cur].id:null;cur=-1;
  if(push){try{history.pushState(null,'','#work')}catch(e){}}
  const f=id&&document.querySelector(`.frame[data-id="${id}"]`);if(f)f.focus({preventScroll:false});
};
const step=d=>{if(cur<0)return;openP(DATA[(cur+d+DATA.length)%DATA.length].id)};
const setLang=L=>{
  if(!T[L])L='en';lang=L;document.documentElement.lang=L;document.title={ru:'Богдан Гривюк — архитектор · Revit и 3D-визуализация',es:'Bogdan Griviuk — Arquitecto · Revit y visualización 3D'}[L]||'Bogdan Griviuk — Architect · Revit & 3D Visualization';
  for(const el of document.querySelectorAll('[data-t]')){const v=T[L][el.dataset.t];el.textContent=typeof v==='string'?v:''}
  for(const el of document.querySelectorAll('[data-h]'))el.innerHTML=T[L][el.dataset.h]??'';
  for(const b of document.querySelectorAll('[data-lang]'))b.setAttribute('aria-pressed',b.dataset.lang===L?'true':'false');
  drawChips();drawGrid();drawTl();drawSv();$('note').textContent='';
  if(cur>=0)openP(DATA[cur].id,false);
  try{localStorage.setItem('lang',L)}catch(e){}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(b){setLang(b.dataset.lang);return}
  const c=e.target.closest('.chip');if(c){cat=c.dataset.c;drawChips();drawGrid();return}
  const f=e.target.closest('.frame');if(f){openP(f.dataset.id);return}
  if(e.target.closest('#vclose')){closeV();return}
  if(e.target.closest('#vnext')||e.target.closest('#vfwd')){step(1);return}
  if(e.target.closest('#vprev')||e.target.closest('#vback')){step(-1);return}
  const tb=e.target.closest('.tab');if(tb&&cur>=0){openP(DATA[cur].id,false,tb.dataset.tab);$('viewer').scrollTop=0;return}
  const fig=e.target.closest('.vbody figure');if(fig&&(e.target.tagName==='IMG'||e.target.classList.contains('bg'))){fig.classList.toggle('zoom')}
});
document.addEventListener('keydown',e=>{
  if(cur<0)return;
  if(e.key==='Escape')closeV();else if(e.key==='ArrowRight')step(1);else if(e.key==='ArrowLeft')step(-1);
});
let wasAbout=false;
const route=()=>{const h=location.hash.slice(1);const ab=h==='about',sv=h==='services';document.body.classList.toggle('pg-about',ab);document.body.classList.toggle('pg-services',sv);if(ab||sv){closeV(false);window.scrollTo(0,0);wasAbout=true;return}if(wasAbout){wasAbout=false;const el=h&&document.getElementById(h);if(el)el.scrollIntoView();else window.scrollTo(0,0)}if(DATA.some(p=>p.id===h))openP(h,false);else closeV(false)};
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);
$('copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText('bogdan.mountainight@gmail.com');$('note').textContent=T[lang].copied}
  catch(e){$('note').textContent=T[lang].blocked}
});
let start='en';
try{const s=localStorage.getItem('lang');if(s&&T[s])start=s;else{const n=(navigator.language||'en').slice(0,2);if(T[n])start=n}}catch(e){const n=(navigator.language||'en').slice(0,2);if(T[n])start=n}
setLang(start);route();
}
